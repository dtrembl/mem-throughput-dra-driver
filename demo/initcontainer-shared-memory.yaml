# Example: InitContainer Sharing a Memory Device with a Container
#
# One pod: one initContainer + one container.
# Each asking for shared access to a single memory device.
#
# Expected: Both the initContainer and container see the same memory device. Check with:
#   kubectl logs -n initcontainer-shared-memory pod0 -c init0 | grep MEM_DEVICE
#   kubectl logs -n initcontainer-shared-memory pod0 -c ctr0 | grep MEM_DEVICE
# Both should show the same memory device ID.
#
# Driver requirements:
#   Profile: mem
#   NUMA nodes: 1
#
# Cluster requirements:
#   Kubernetes 1.34+

---
apiVersion: v1
kind: Namespace
metadata:
  name: initcontainer-shared-memory

---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: initcontainer-shared-memory
  name: single-memory
spec:
  spec:
    devices:
      requests:
      - name: memory
        exactly:
          deviceClassName: memory.example.com

---
apiVersion: v1
kind: Pod
metadata:
  namespace: initcontainer-shared-memory
  name: pod0
spec:
  initContainers:
  - name: init0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["export"]
    resources:
      claims:
      - name: shared-memory
  containers:
  - name: ctr0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["export; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: shared-memory
  resourceClaims:
  - name: shared-memory
    resourceClaimTemplateName: single-memory
