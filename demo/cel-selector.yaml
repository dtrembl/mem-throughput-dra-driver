# Example: CEL Expression Selectors
#
# One pod, one container.
# Uses CEL expression selectors instead of matching on a DeviceClass.
# Selects a memory device with a specific NUMA node and at least 4Gi of memory.
#
# Expected: The container gets 1 memory device matching the CEL constraints. Check with:
#   kubectl logs -n cel-selector pod0 -c ctr0 | grep MEM_DEVICE
# The container should have 1 MEM_DEVICE_NUMA env var.
#
# Driver requirements:
#   Profile: mem
#   NUMA nodes: 1
#
# Cluster requirements:
#   Kubernetes 1.34+

---
apiVersion: v1
kind: Namespace
metadata:
  name: cel-selector

---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: cel-selector
  name: single-memory-cel
spec:
  spec:
    devices:
      requests:
      - name: memory
        exactly:
          deviceClassName: memory.example.com
          selectors:
          - cel:
              expression: "device.attributes['memory.example.com'].numa >= 0"
          - cel:
              expression: "device.capacity['memory.example.com'].memory.compareTo(quantity('4Gi')) >= 0"

---
apiVersion: v1
kind: Pod
metadata:
  namespace: cel-selector
  name: pod0
  labels:
    app: pod
spec:
  containers:
  - name: ctr0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["export; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: memory
  resourceClaims:
  - name: memory
    resourceClaimTemplateName: single-memory-cel
