# Example: Multiple Pods, One Memory Device Each
#
# Multiple pods, one container each.
# Each container asking for memory from distinct NUMA nodes.
#
# Expected: Each pod gets a different memory device. Check with:
#   kubectl logs -n basic-resourceclaimtemplate pod0 -c ctr0 | grep MEM_DEVICE
#   kubectl logs -n basic-resourceclaimtemplate pod1 -c ctr0 | grep MEM_DEVICE
# Each container should have 1 MEM_DEVICE_NUMA env var with a distinct memory device ID.
#
# Driver requirements:
#   Profile: mem
#   NUMA nodes: 2+
#
# Cluster requirements:
#   Kubernetes 1.34+

---
apiVersion: v1
kind: Namespace
metadata:
  name: basic-resourceclaimtemplate

---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: basic-resourceclaimtemplate
  name: single-pod
spec:
  spec:
    devices:
      requests:
      - name: mem
        exactly:
          deviceClassName: mem.example.com
          capacity:
            requests:
              mem: "10Gi"

---
apiVersion: v1
kind: Pod
metadata:
  namespace: basic-resourceclaimtemplate
  name: pod0
  labels:
    app: pod
spec:
  containers:
  - name: ctr0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["export; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: mem
  resourceClaims:
  - name: mem
    resourceClaimTemplateName: single-pod

---
apiVersion: v1
kind: Pod
metadata:
  namespace: basic-resourceclaimtemplate
  name: pod1
  labels:
    app: pod
spec:
  containers:
  - name: ctr0
