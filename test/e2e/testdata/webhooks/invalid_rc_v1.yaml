apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: webhook-test
spec:
  devices:
    requests:
    - name: ts-memory
      exactly:
        deviceClassName: memory.example.com
    - name: sp-memory
      exactly:
        deviceClassName: memory.example.com
    config:
    - requests: ["ts-memory"]
      opaque:
        driver: memory.example.com
        parameters:
          apiVersion: memory.resource.example.com/v1alpha1
          kind: MemoryConfig
          sharing:
            strategy: TimeSlicing
            timeSlicingConfig:
              interval: InvalidInterval
